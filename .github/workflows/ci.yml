name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinicdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CLINIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/clinicdb_test
      CLINIC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/clinicdb_test
      CLINIC_AUTH_MODE: "none"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('pyproject.toml') }}
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: mypy app
      - name: Migration drift check
        run: |
          alembic upgrade head
          alembic check
      - run: pytest --cov=app --cov-report=term-missing

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "RENDER_DEPLOY_HOOK_URL not set; skipping"; exit 0; fi
          status=$(curl -sS -o /tmp/hook.out -w '%{http_code}' -X POST "$HOOK")
          echo "deploy hook returned $status"
          test "$status" = "200" -o "$status" = "201" -o "$status" = "202"
      - name: Smoke check
        env:
          BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then echo "DEPLOY_BASE_URL not set; skipping"; exit 0; fi
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE_URL/health" >/dev/null && curl -fsS "$BASE_URL/ready" >/dev/null; then
              echo "smoke ok"
              exit 0
            fi
            sleep 10
          done
          echo "smoke failed"
          exit 1
