name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clinicdb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CLINIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/clinicdb_test
      CLINIC_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/clinicdb_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: ruff check app tests
      - run: mypy app
      - run: pytest --cov=app --cov-report=term-missing

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger platform deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set; skipping deploy."
            exit 0
          fi
          code=$(curl -sS -o /tmp/hook.out -w '%{http_code}' -X POST "$HOOK")
          echo "deploy hook returned $code"
          case "$code" in
            200|201|202) ;;
            *) echo "deploy hook failed with $code"; exit 1 ;;
          esac

      - name: Smoke check
        env:
          BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "DEPLOY_BASE_URL is not set; skipping smoke check."
            exit 0
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS "$BASE_URL/health" > /dev/null; then
              echo "smoke check passed"
              exit 0
            fi
            sleep 10
          done
          echo "smoke check failed"
          exit 1

      - name: Verify deployed commit
        env:
          BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: |
          if [ -z "$BASE_URL" ]; then
            echo "DEPLOY_BASE_URL is not set; skipping commit check."
            exit 0
          fi
          for attempt in $(seq 1 30); do
            commit=$(curl -fsS "$BASE_URL/version" | python -c 'import json,sys; print(json.load(sys.stdin).get("commit",""))' 2>/dev/null || true)
            case "$GITHUB_SHA" in
              "$commit"*)
                if [ -n "$commit" ] && [ "$commit" != "unknown" ]; then
                  echo "deployed commit $commit"
                  exit 0
                fi
                ;;
            esac
            sleep 10
          done
          echo "deployment did not report commit $GITHUB_SHA"
          exit 1
