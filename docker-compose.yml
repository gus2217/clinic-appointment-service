services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ***
      POSTGRES_DB: clinicdb
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20
  api:
    build: .
    environment:
      CLINIC_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/clinicdb
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
